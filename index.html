<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>言語能力提昇課程 - 拼字大師</title>
    <style>
        /* =========================================
           Minecraft 像素主題與動態背景
           ========================================= */
        body { 
            font-family: "Courier New", Courier, monospace, -apple-system, sans-serif; 
            background-color: #5C94FC; 
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.2) 2px, transparent 2px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.2) 2px, transparent 2px);
            background-size: 40px 40px;
            color: #333; margin: 0; padding: 20px; text-align: center; 
            overflow-x: hidden;
        }
        .hidden { display: none !important; }
        
        .clouds-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .cloud { position: absolute; background: white; opacity: 0.8; box-shadow: 10px 10px 0px rgba(255,255,255,0.5), -10px -10px 0px rgba(255,255,255,0.5), 10px -10px 0px rgba(255,255,255,0.5), -10px 10px 0px rgba(255,255,255,0.5); }
        @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(120vw); } }
        .cloud-1 { width: 120px; height: 40px; top: 15%; animation: drift 40s linear infinite; }
        .cloud-2 { width: 180px; height: 60px; top: 40%; animation: drift 55s linear infinite; animation-delay: -15s; opacity: 0.6; }
        .cloud-3 { width: 100px; height: 30px; top: 70%; animation: drift 35s linear infinite; animation-delay: -25s; }

        @keyframes bobbing { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .mc-title-container { animation: bobbing 3s ease-in-out infinite; margin-top: 40px; margin-bottom: 40px; }
        .mc-title { 
            color: #FFF; font-size: 52px; font-weight: 900; display: inline-block;
            text-shadow: 6px 6px 0px #3E2813, -2px -2px 0px #55AA55, 2px -2px 0px #55AA55, -2px 2px 0px #55AA55, 2px 2px 0px #55AA55; 
            letter-spacing: 4px; padding: 20px 40px; background: #8B5A2B; border: 6px solid #3E2813; border-top: 20px solid #55AA55; box-shadow: 10px 10px 0px rgba(0,0,0,0.3);
        }
        
        .btn { 
            padding: 15px 30px; font-size: 22px; font-weight: bold; margin: 10px; cursor: pointer; 
            background: #C6C6C6; color: #111; border: 4px solid; border-color: #FFF #555 #555 #FFF; 
            transition: all 0.1s; font-family: "Courier New", Courier, monospace, sans-serif; box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
        }
        .btn:active { border-color: #555 #FFF #FFF #555; background: #B0B0B0; transform: translateY(4px); box-shadow: 0px 0px 0px rgba(0,0,0,0.2); }
        .btn-primary { background: #55AA55; color: #FFF; border-color: #77CC77 #226622 #226622 #77CC77; text-shadow: 2px 2px 0px #226622; }
        .btn-primary:active { border-color: #226622 #77CC77 #77CC77 #226622; }
        .btn-download { background: #FFD700; color: #111; border-color: #FFF #B8860B #B8860B #FFF; text-shadow: none; font-size: 24px; padding: 20px; }

        .detail-main-layout { display: flex; justify-content: center; align-items: flex-start; gap: 30px; max-width: 1000px; margin: 0 auto; flex-wrap: wrap; }
        .target-left-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #8B5A2B; border: 4px solid #3E2813; border-top: 16px solid #55AA55; padding: 20px; box-shadow: 8px 8px 0px rgba(0,0,0,0.3); min-width: 150px; }
        #detail-target-title { font-size: 90px; margin: 0 0 10px 0; font-weight: 900; color: #FFF; text-shadow: 4px 4px 0px #3E2813; }

        .carousel-container { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 320px; max-width: 600px; position: relative; }
        .phrase-card { background: #C6C6C6; border: 4px solid; border-color: #FFF #555 #555 #FFF; padding: 25px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; box-shadow: 8px 8px 0px rgba(0,0,0,0.2); }
        .phrase-img { width: 100%; max-width: 280px; height: 260px; object-fit: cover; background: #FFF; margin-bottom: 20px; border: 4px solid #555; }
        
        .game-status { font-size: 24px; font-weight: bold; margin-bottom: 15px; height: 35px; color: #111; background: #FFF; padding: 5px 15px; border: 2px solid #111; border-radius: 4px;}
        .slots-container, .options-container { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; min-height: 90px; align-items: center; flex-wrap: wrap; }
        
        .char-block { font-size: 42px; font-weight: bold; width: 85px; height: 85px; display: flex; align-items: center; justify-content: center; background: #8B5A2B; border: 4px solid #5C3A18; border-top: 15px solid #55AA55; border-left-color: #734A24; color: #FFF; text-shadow: 3px 3px 0px rgba(0,0,0,0.6); cursor: pointer; user-select: none; box-shadow: 4px 4px 0px rgba(0,0,0,0.3); transition: transform 0.1s; }
        .char-block:active { transform: translateY(4px); box-shadow: 0px 0px 0px rgba(0,0,0,0.3); }
        .char-block.empty { background: rgba(0,0,0,0.1); border: 4px dashed #FFF; box-shadow: none; pointer-events: none; }
        .char-block.correct { background: #FFD700; border-top-color: #FFF; color: #000; text-shadow: none; border-color: #DAA520; }
        .char-block.selected { background: #FFD700; border-top-color: #FFF; color: #000; text-shadow: none; border-color: #DAA520; transform: translateY(4px); box-shadow: 0px 0px 0px rgba(0,0,0,0.3); }
        
        @keyframes placeBlock { 0% { transform: scale(1.3); } 50% { transform: scale(0.9); } 100% { transform: scale(1); } }
        .animate-place { animation: placeBlock 0.2s ease-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .animate-wrong { animation: shake 0.3s ease-in-out; border-top-color: #FF5555 !important; }

        .popup-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 100; border-radius: 4px; }
        .popup-box { background: #C6C6C6; border: 6px solid; border-color: #FFF #555 #555 #FFF; padding: 30px; text-align: center; width: 85%; box-shadow: 0 0 20px #FFD700; }
        .popup-title { font-size: 32px; color: #226622; margin-bottom: 10px; font-weight: 900; }
        .popup-word { font-size: 60px; font-weight: bold; color: #111; margin-bottom: 10px; }
        .popup-meaning { font-size: 22px; color: #333; margin-bottom: 25px; background: #FFF; padding: 10px; border: 4px solid #555; }

        .admin-panel { max-width: 900px; margin: 0 auto; text-align: left; background: #C6C6C6; padding: 30px; border: 4px solid; border-color: #FFF #555 #555 #FFF; box-shadow: 10px 10px 0px rgba(0,0,0,0.3); margin-bottom: 40px;}
        .admin-input { font-size: 18px; padding: 10px; border: 2px solid #555; width: 100%; margin-bottom: 8px; box-sizing: border-box; font-family: sans-serif; }
        .editor-section { background: #FFF; padding: 20px; margin-bottom: 20px; border: 4px solid #555; }

        /* 新增：道具欄格子樣式 */
        .inv-slot { 
            width: 45px; height: 45px; background: #8b8b8b; 
            border: 4px solid; border-color: #373737 #fff #fff #373737; 
            font-size: 28px; display: flex; align-items: center; justify-content: center; 
            user-select: none; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); box-sizing: border-box; 
        }
    </style>
</head>
<body>

    <div class="clouds-container">
        <div class="cloud cloud-1"></div><div class="cloud cloud-2"></div><div class="cloud cloud-3"></div>
    </div>

    <div id="menu-screen">
        <div class="mc-title-container">
            <div class="mc-title" id="display-main-title">拼字大師</div>
        </div>
        <br>
        <button class="btn btn-primary" style="font-size: 28px; padding: 20px 40px;" onclick="showReviewList()">▶️ 開始挑戰</button><br>
        <button class="btn" onclick="showLogin()">⚙️ 管理頁面</button>
    </div>

    <div id="review-list-screen" class="hidden">
        <h1 style="color: #111; text-shadow: 2px 2px 0px #FFF;">請選擇目標方塊 (可多選)</h1>
        <div class="slots-container" id="target-grid" style="max-width: 800px; margin: 0 auto;"></div>
        <br>
        <button class="btn btn-primary hidden" id="start-selected-btn" style="font-size: 24px; padding: 15px 30px;" onclick="startSelectedGame()">▶️ 開始所選挑戰</button>
        <br><br><button class="btn" onclick="backToMenu()">返回主選單</button>
    </div>

    <div id="review-detail-screen" class="hidden" style="padding-bottom: 120px;">
        <div class="detail-main-layout">
            <div class="target-left-panel">
                <h1 id="detail-target-title">字</h1>
                <button class="btn" style="background: #FFF; border-color: #CCC #555 #555 #CCC; border-radius: 0; width: 80px;" onclick="playTargetWordVoice()">🔊</button>
            </div>
            
            <div class="carousel-container">
                <div id="game-status-msg" class="game-status">請點選下方字塊拼出詞語</div>
                
                <div class="phrase-card">
                    <img id="phrase-current-img" class="phrase-img" src="" alt="提示圖片">
                    <div class="slots-container" id="answer-slots"></div>
                    <div class="options-container" id="letter-options"></div>

                    <div id="success-popup" class="popup-overlay hidden">
                        <div class="popup-box">
                            <div class="popup-title">✨ 挑戰成功！ ✨</div>
                            <div class="popup-word" id="popup-word-display">身高</div>
                            <div class="popup-meaning" id="popup-meaning-display">意思：身體的高度</div>
                            <div id="popup-reward-display" style="font-size: 22px; color: #8B5A2B; margin-bottom: 25px; font-weight: bold; background: #FFF9E6; border: 4px dashed #DAA520; padding: 10px;"></div>
                            <button class="btn btn-primary" onclick="nextPhrase()">繼續下一個 ➡️</button>
                        </div>
                    </div>
                </div>
                <div style="font-size: 18px; font-weight: bold; margin-top: 15px; background: #FFF; padding: 5px 15px; border: 2px solid #111;" id="phrase-counter">進度: 1 / 2</div>
                
                <div id="reward-container" style="display: none; width: 100%; box-sizing: border-box; background: #8B5A2B; border: 4px solid #3E2813; border-top: 8px solid #55AA55; padding: 15px; margin-top: 15px; text-align: left; box-shadow: inset 4px 4px 0px rgba(0,0,0,0.3); color: #FFF;">
                    <div style="font-size: 20px; font-weight: 900; margin-bottom: 10px; text-shadow: 2px 2px 0px #3E2813;">🎒 獎勵背包</div>
                    <div id="blocks-display" style="font-size: 24px; min-height: 35px;">收集的方塊: </div>
                    <div id="items-display" style="font-size: 28px; margin-top: 5px; min-height: 40px;">合成的物品: </div>
                </div>
            </div>
        </div>
        <br><button class="btn" onclick="showReviewList()">🔙 返回字庫</button>

        <div id="game-hud" style="position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; z-index: 50;">
            <div id="health-bar" style="font-size: 28px; text-shadow: 2px 2px 0px rgba(0,0,0,0.5); margin-bottom: 5px; width: 100%; text-align: left; padding-left: 5px;">❤️❤️❤️❤️❤️</div>
            <div id="inventory-bar" style="display: flex; gap: 2px; background: #8B5A2B; padding: 5px; border: 4px solid #3E2813; border-top-color: #55AA55;">
                <div id="inv-slot-0" class="inv-slot"></div>
                <div id="inv-slot-1" class="inv-slot"></div>
                <div id="inv-slot-2" class="inv-slot"></div>
                <div id="inv-slot-3" class="inv-slot"></div>
                <div id="inv-slot-4" class="inv-slot"></div>
                <div id="inv-slot-5" class="inv-slot"></div>
                <div id="inv-slot-6" class="inv-slot"></div>
                <div id="inv-slot-7" class="inv-slot"></div>
                <div id="inv-slot-8" class="inv-slot"></div>
            </div>
        </div>
    </div>

    <div id="login-screen" class="hidden">
        <h1 style="color: #111; text-shadow: 2px 2px 0px #FFF;">管理員登入</h1>
        <input type="password" id="admin-pw" class="admin-input" style="max-width: 300px; text-align: center;" placeholder="輸入密碼">
        <br><button class="btn btn-primary" onclick="verifyAdmin()">登入</button>
        <button class="btn" onclick="backToMenu()">返回</button>
    </div>

    <div id="admin-screen" class="hidden admin-panel">
        <h2 style="margin-top:0; border-bottom: 4px solid #555; padding-bottom: 10px;">⚙️ 管理頁面</h2>
        
        <div class="editor-section" style="background: #E8F8F5;">
            <h3 style="margin-top:0; color: #226622;">網頁標題設定</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="admin-title-input" class="admin-input" style="margin-bottom:0;" placeholder="輸入新的網頁標題">
                <button class="btn btn-primary" onclick="saveTitle()" style="margin: 0; white-space: nowrap;">更新標題</button>
            </div>
        </div>

        <h3 style="color: #333;">管理目標字庫</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="new-target-input" class="admin-input" placeholder="新增目標字 (例：身)" style="margin-bottom:0; flex: 1;">
            <input type="text" id="new-target-homophone" class="admin-input" placeholder="同音字校正(選填)" style="margin-bottom:0; flex: 1; background:#E8F8F5;">
            <button class="btn btn-primary" onclick="addNewTarget()" style="margin: 0; white-space: nowrap;">新增目標字</button>
        </div>
        <div id="admin-target-list"></div>
        
        <br><hr style="border: 2px solid #555;"><br>
        <button class="btn btn-download" style="width: 100%; margin-left: 0;" onclick="downloadUpdatedHTML()">📥 下載保存最新網頁 (供跨裝置使用)</button>
        <button class="btn" onclick="backToMenu()" style="width: 100%; margin-left: 0; margin-top: 10px;">返回主選單</button>
    </div>

    <div id="edit-target-screen" class="hidden admin-panel">
        <h2 id="edit-title" style="border-bottom: 4px solid #555; padding-bottom: 10px;">編輯詞語：</h2>
        <div id="edit-phrase-list"></div>
        
        <div class="editor-section" style="background: #FFF9E6; border-color: #DAA520;">
            <h3 style="margin-top:0; color: #B8860B;">➕ 新增詞語</h3>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="new-phrase-text" class="admin-input" placeholder="詞語 (例：身高)">
                <input type="text" id="new-phrase-homophone" class="admin-input" placeholder="同音字 (選填)" style="background:#E8F8F5;">
                <input type="text" id="new-phrase-meaning" class="admin-input" placeholder="粵語解釋 (例：身體的高度)">
            </div>
            <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
                <input type="text" id="new-phrase-img" class="admin-input" placeholder="圖片網址" style="margin-bottom: 0;">
                <button class="btn" onclick="searchGoogleImage('new-phrase-text')" style="margin: 0; padding: 10px 15px; background: #FFD700; white-space: nowrap;">🔍 找圖</button>
            </div>
            <button class="btn btn-primary" onclick="addPhrase()" style="width:100%; margin:0;">儲存新詞語</button>
        </div>
        
        <button class="btn" onclick="backToAdminList()" style="width: 100%; margin-left: 0;">🔙 返回字庫管理</button>
    </div>

        // --- 網頁音效合成器 ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15); 
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3); 
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
                osc.start(); osc.stop(audioCtx.currentTime + 0.6);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'complete') {
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15); 
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3); 
                osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.45); 
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.2);
                osc.start(); osc.stop(audioCtx.currentTime + 1.2);
            }
        }

        // --- 新增：彩帶特效產生器 ---
        function showConfetti() {
            const colors = ['#FFD700', '#FF5555', '#55AA55', '#5C94FC', '#FFF'];
            for (let i = 0; i < 80; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = (Math.random() * 8 + 6) + 'px';
                confetti.style.height = (Math.random() * 8 + 6) + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-20px';
                confetti.style.zIndex = '9999';
                confetti.style.pointerEvents = 'none';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                document.body.appendChild(confetti);

                const duration = Math.random() * 2 + 2; 
                const delay = Math.random() * 0.2;

                confetti.animate([
                    { transform: `translate3d(0, 0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate3d(${Math.random() * 200 - 100}px, 100vh, 0) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    delay: delay * 1000,
                    easing: 'cubic-bezier(.37,0,.63,1)',
                    fill: 'forwards'
                });

                setTimeout(() => confetti.remove(), (duration + delay) * 1000);
            }
        }

        // --- 女聲語音引擎 ---
        if ('speechSynthesis' in window) { window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices(); }

        function playCantonese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK'; utterance.rate = 0.85; utterance.pitch = 1.25; 
                const voices = window.speechSynthesis.getVoices();
                let hkVoices = voices.filter(v => v.lang.includes('zh-HK') || v.lang.includes('HK') || v.lang.includes('yue'));
                if (hkVoices.length > 0) {
                    const femaleKeywords = ['sin-ji', 'sinji', 'tracy', 'hiumaan', 'female', '女'];
                    const maleKeywords = ['danny', 'wanlung', 'male', '男'];
                    let femaleVoice = hkVoices.find(v => femaleKeywords.some(k => v.name.toLowerCase().includes(k)));
                    if (!femaleVoice) femaleVoice = hkVoices.find(v => !maleKeywords.some(k => v.name.toLowerCase().includes(k)));
                    utterance.voice = femaleVoice || hkVoices[0];
                }
                window.speechSynthesis.speak(utterance);
            }
        }
        function playTargetWordVoice() { 
            const item = appData[activeTargetIndex];
            playCantonese(item.targetHomophone || item.target); 
        }

        function updateHUD() {

                heartsHtml += (i < currentHearts) ? '❤️' : '🖤';
            }

                const slot = document.getElementById('inv-slot-' + i);
                if(slot) {

        // --- 學生模式 ---
        function showReviewList() {
            hideAll(); document.getElementById('review-list-screen').classList.remove('hidden');
            selectedTargetIndices = []; // 重置選擇
            currentHearts = 5; // 每次回到字庫選擇時，重置為 5 顆心
            updateHUD();

                grid.appendChild(box);
            });

        function toggleTargetSelection(index, boxElement) {
            const idx = selectedTargetIndices.indexOf(index);
            if (idx > -1) {
                selectedTargetIndices.splice(idx, 1);
                boxElement.classList.remove('selected');
            } else {
                selectedTargetIndices.push(index);
                boxElement.classList.add('selected');
            }
            
            const startBtn = document.getElementById('start-selected-btn');
            if (selectedTargetIndices.length > 0) {
                startBtn.classList.remove('hidden');
            } else {
                startBtn.classList.add('hidden');
            }
        }

        function startSelectedGame() {
            if (selectedTargetIndices.length === 0) return;
            currentSelectionQueueIndex = 0;
            openQueuedTarget();
        }

        function openQueuedTarget() {
            const targetAppIndex = selectedTargetIndices[currentSelectionQueueIndex];
            hideAll(); document.getElementById('review-detail-screen').classList.remove('hidden');
            activeTargetIndex = targetAppIndex; currentPhraseIndex = 0;
            document.getElementById('detail-target-title').innerText = appData[activeTargetIndex].target;
            
            initSpellingGame();
        }

        function openTargetDetail(index) {
            // 保留原有函數避免外部參照錯誤，但我們現在主流程改用 openQueuedTarget
            hideAll(); document.getElementById('review-detail-screen').classList.remove('hidden');
            activeTargetIndex = index; currentPhraseIndex = 0;
            document.getElementById('detail-target-title').innerText = appData[index].target;
            
            initSpellingGame();
        }

        function updateRewardUI() {
            const blocksDiv = document.getElementById('blocks-display');
            const itemsDiv = document.getElementById('items-display');
            if(blocksDiv) {
                let blockStr = "";
                for(let i=0; i<currentBlocks; i++) blockStr += "🟫 ";
                blocksDiv.innerText = "收集的方塊: " + (blockStr || "無");
            }
            if(itemsDiv) {
                itemsDiv.innerText = "合成的物品: " + (unlockedItems.join(" ") || "無");
            }
            updateHUD(); // 同步更新底部道具欄
        }

        function initSpellingGame() {
            const item = appData[activeTargetIndex];
            userAnswers = []; document.getElementById('success-popup').classList.add('hidden');
            updateRewardUI();

            if (!item.phrases || item.phrases.length === 0) return;
            const phrase = item.phrases[currentPhraseIndex];
            document.getElementById('phrase-current-img').src = phrase.img || "https://placehold.co/400x400/C6C6C6/111?font=montserrat&text=Picture";
            
            let correctChars = phrase.text.split('');
            let optionsPool = [...correctChars];
            let allDatabaseChars = new Set();
            appData.forEach(d => d.phrases.forEach(p => p.text.split('').forEach(c => allDatabaseChars.add(c))));
            ['大','小','上','下','多','少','日','月','天','地','人','心'].forEach(c => allDatabaseChars.add(c));
            
            let availableRandomChars = Array.from(allDatabaseChars).filter(c => !correctChars.includes(c));
            while (optionsPool.length < 6) {
                let randChar = availableRandomChars[Math.floor(Math.random() * availableRandomChars.length)];
                if (!optionsPool.includes(randChar)) optionsPool.push(randChar);
            }
            optionsPool.sort(() => Math.random() - 0.5);
            shuffledChars = optionsPool.map(c => ({ char: c, used: false }));

            renderGameBoards();
            document.getElementById('phrase-counter').innerText = `進度: ${currentPhraseIndex + 1} / ${item.phrases.length}`;
        }

        function renderGameBoards() {
            const phrase = appData[activeTargetIndex].phrases[currentPhraseIndex];
            const slotsContainer = document.getElementById('answer-slots'); slotsContainer.innerHTML = '';
            for (let i = 0; i < phrase.text.length; i++) {
                const slot = document.createElement('div'); slot.className = 'char-block empty';
                if (userAnswers[i] !== undefined) {
                    slot.className = 'char-block animate-place'; slot.innerText = userAnswers[i];
                    slot.onclick = () => { playSound('click'); removeCharacter(i); };
                }
                slotsContainer.appendChild(slot);
            }
            const optionsContainer = document.getElementById('letter-options'); optionsContainer.innerHTML = '';
            shuffledChars.forEach((item, index) => {
                const block = document.createElement('div');
                if (item.used) block.className = 'char-block empty';
                else { block.className = 'char-block'; block.innerText = item.char; block.onclick = () => { playSound('click'); selectCharacter(index); }; }
                optionsContainer.appendChild(block);
            });
        }

        function selectCharacter(index) {
            const phrase = appData[activeTargetIndex].phrases[currentPhraseIndex];
            if (userAnswers.length < phrase.text.length) {
                shuffledChars[index].used = true; userAnswers.push(shuffledChars[index].char);
                renderGameBoards();
                if (userAnswers.length === phrase.text.length) checkSpellingAnswer();
            }
        }

        function removeCharacter(slotIndex) {
            const charToRemove = userAnswers[slotIndex];
            const found = shuffledChars.find(item => item.char === charToRemove && item.used);
            if (found) found.used = false;
            userAnswers.splice(slotIndex, 1); renderGameBoards();
        }

        function checkSpellingAnswer() {
            const phrase = appData[activeTargetIndex].phrases[currentPhraseIndex];
            if (userAnswers.join('') === phrase.text) {
                playSound('success');
                document.getElementById('popup-word-display').innerText = phrase.text;
                document.getElementById('popup-meaning-display').innerText = `意思：${phrase.meaning || '暫無提示'}`;
                
                // 核心邏輯確認區：已嚴格鎖定您的需求
                currentBlocks++; // 規則1：回答一題，給予1個方塊
                let newlyUnlocked = null;
                if (currentBlocks >= 2) { // 規則2：回答2題（即收集滿2個方塊），才會有合成獎勵物件
                    currentBlocks -= 2;   // 消耗這2個方塊進行合成
                    newlyUnlocked = mcItemPool[Math.floor(Math.random() * mcItemPool.length)];
                    unlockedItems.push(newlyUnlocked);
                }
                updateRewardUI(); // 這會同時呼叫 updateHUD 幫你更新底部欄
                
                let rewardMsg = "獲得 1 個方塊！<div style='font-size: 70px; line-height: 1; margin: 10px 0; animation: placeBlock 0.3s ease-out;'>🟫</div>";
                if (newlyUnlocked) {
                    rewardMsg += `🎉 2 個方塊成功合成了：<div style='font-size: 90px; line-height: 1; margin: 15px 0; animation: placeBlock 0.5s ease-out; text-shadow: 0 0 15px #FFD700;'>${newlyUnlocked}</div>`;
                }
                document.getElementById('popup-reward-display').innerHTML = rewardMsg;

                document.getElementById('success-popup').classList.remove('hidden');
                
                // 語音回饋：讀出同音字（如果有）和定義
                const spokenText = phrase.homophone || phrase.text;
                const explanation = phrase.meaning ? `${spokenText}，${phrase.meaning}。` : `${spokenText}。`;
                playCantonese(explanation);
            } else {
                // 答錯邏輯修改：扣除心心
                currentHearts--;
                if(currentHearts < 0) currentHearts = 0; // 確保不會低於0
                updateHUD();

                playSound('wrong');
                const slots = document.querySelectorAll('#answer-slots .char-block');
                slots.forEach(s => s.classList.add('animate-wrong'));
                playCantonese("唔啱，再試下啦。");
                setTimeout(() => { userAnswers = []; shuffledChars.forEach(item => item.used = false); renderGameBoards(); }, 1000);
            }
        }

        function nextPhrase() {
            if (currentPhraseIndex < appData[activeTargetIndex].phrases.length - 1) { 
                currentPhraseIndex++; 
                initSpellingGame(); 
            } else {
                // 當前字詞的所有挑戰已完成，檢查是否有下一個被選擇的目標
                currentSelectionQueueIndex++;
                if (currentSelectionQueueIndex < selectedTargetIndices.length) {
                    openQueuedTarget(); // 開啟下一個排隊中的挑戰
                } else {
                    showReviewList(); // 全部完成，返回字庫選單
                    playSound('complete'); // 新增：播放通關音效
                    showConfetti(); // 新增：觸發滿屏彩帶
                }
            }
        }

        function saveInlinePhrase(i) {
            const text = document.getElementById(`inline-text-${i}`).value.trim();
            const homo = document.getElementById(`inline-homophone-${i}`).value.trim();
            const mean = document.getElementById(`inline-mean-${i}`).value.trim();
            const img = document.getElementById(`inline-img-${i}`).value.trim();
            if(!text) return alert("詞語不能為空！");
            appData[currentEditTargetIndex].phrases[i] = { text:text, homophone:homo, meaning:mean, img:img };
            localStorage.setItem('ama_mc_data_v3', JSON.stringify(appData));
            renderEditPhraseList(); // 重新渲染以更新左側圖片預覽
        }
        
        function addPhrase() {
            const t = document.getElementById('new-phrase-text').value.trim();
            const h = document.getElementById('new-phrase-homophone').value.trim();
            const m = document.getElementById('new-phrase-meaning').value.trim();
            const img = document.getElementById('new-phrase-img').value.trim();
            if(!t) return alert("詞語不能為空！");
            appData[currentEditTargetIndex].phrases.push({text:t, homophone:h, meaning:m, img:img});
            localStorage.setItem('ama_mc_data_v3', JSON.stringify(appData));
            
            // 清空新增欄位
            document.getElementById('new-phrase-text').value='';
            document.getElementById('new-phrase-homophone').value='';
            document.getElementById('new-phrase-meaning').value='';
            document.getElementById('new-phrase-img').value='';
            renderEditPhraseList();
        }
        
        function deletePhrase(i) { 
            if(confirm("刪除此詞？")){ 
                appData[currentEditTargetIndex].phrases.splice(i,1); 
                localStorage.setItem('ama_mc_data_v3', JSON.stringify(appData)); 
                renderEditPhraseList(); 
            } 
        }

        // --- 核心功能：下載最新 HTML (跨裝置保存) ---
        function downloadUpdatedHTML() {
            // 先暫時切換回主畫面，確保下載後的網頁一打開是主選單
            hideAll();
            document.getElementById('menu-screen').classList.remove('hidden');

            // 準備最新的數據字串
            let dataStr = `// === DATA_START ===\n        let savedAppData = ${JSON.stringify(appData)};\n        // === DATA_END ===`;
            let titleStr = `// === TITLE_START ===\n        let savedAppTitle = ${JSON.stringify(currentAppTitle)};\n        // === TITLE_END ===`;

            // 抓取整個 HTML 並替換數據區塊
            let currentHTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            currentHTML = currentHTML.replace(/\/\/ === DATA_START ===[\s\S]*?\/\/ === DATA_END ===/, dataStr);
            currentHTML = currentHTML.replace(/\/\/ === TITLE_START ===[\s\S]*?\/\/ === TITLE_END ===/, titleStr);

            // 建立下載連結
            const blob = new Blob([currentHTML], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "言語能力提昇_拼字大師.html";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            // 恢復管理頁面畫面
            hideAll();
            document.getElementById('admin-screen').classList.remove('hidden');
            alert("✅ 下載成功！\n你可以將此下載的 HTML 檔案傳送到學校電腦或 iPad 上開啟，所有最新的圖片、字詞和標題都會同步保留！");
        }
    </script>
</body>
